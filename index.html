<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f5">
<title>ナマムギ Song Archive</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>🌸 ナマムギ Song Archive</h1>
<p class="sub">ナマムギちゃんが歌った曲を、もっと見つけやすく 🎧</p>
<div class="stats">
<div class="stat">
<strong id="songCount">—</strong> 曲</div>
<div class="stat">
<strong id="artistCount">—</strong> アーティスト</div>
</div>
</header>
<main class="wrap">
<nav aria-label="表示切り替え">
<button data-tab="artists" class="active">🎤 アーティスト</button>
<button data-tab="recent">📅 投稿順</button>
<button data-tab="works">🎬 作品</button>
<button data-tab="random">🎲 今日のナマムギ</button>
</nav>
<label for="search" class="muted">曲名・アーティスト・作品名で検索（日本語 / 中文 / English）</label>
<input id="search" type="search" placeholder="例：YOASOBI、我推、ピースサイン" autocomplete="off">
<div class="toolbar">
<div>
<button id="back" class="back" hidden>← 一覧へ戻る</button>
<h2 id="heading">アーティストから探す</h2>
</div>
<span id="status" class="muted">
</span>
</div>
<section id="results" aria-live="polite">
</section>
<div class="footer">各動画は公式投稿へのリンクです。</div>
</main>
<script src="app.js" defer>
</script>
</body>
</html>
